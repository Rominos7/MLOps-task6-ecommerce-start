global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: chat-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["chat-agent:8501"]

  - job_name: ml-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-service:8001"]

  - job_name: rag-service
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-service:8002"]

  - job_name: agent-service
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-service:8003"]
